  blattAuf(h, false);
  server('angebotText', [a.k], function (t) { var el = $('beschr'); if (el) { el.className = 'beschr'; el.textContent = t || 'Keine Beschreibung gespeichert.'; a.tx = t; } }, function () { var el = $('beschr'); if (el) el.textContent = ''; });
}

// ---------- Baukasten: eine Gruppe oder gemischt ----------
function bauZeilen(key, b, se) {
  var tausch = (S.bauWahl || {})[key] || {};
  var s = key.split('|')[2];
  var z = b.teile.map(function (x) {
    var k = tausch[x.t] || x.k;
    if (k && !D.idx[k]) k = x.k;
    if (S.bauModus === 'gruppe' && x.t !== 'tretlager' && !tausch[x.t]) {
      var kand = [x.k].concat(x.alt || []).filter(function (kk) { return kk && D.idx[kk] && D.idx[kk].mm.s === s; });
      k = kand[0] || null;
    }
    return { t: x.t, a: k ? D.idx[k] : null, alt: x.alt, ok: x.ok };
  });
  var kurbel = (z.filter(function (x) { return x.t === 'kurbel'; })[0] || {}).a;
  var schaltwerk = (z.filter(function (x) { return x.t === 'schaltwerk'; })[0] || {}).a;
  z.forEach(function (x) {
    if (!x.a) { x.ok = 'fehlt'; return; }
    x.ok = x.t === 'tretlager' ? lagerZuKurbel(x.a, kurbel) : passtZu(x.a, se, schaltwerk);
    x.grund = x.t === 'tretlager' ? (x.ok === 'nein' ? (x.a.mm.st || '?') + '-Lager zur ' + ((kurbel && kurbel.mm.st) || '?') + '-Kurbel' : 'Lagerstandard prüfen') : passtGrund(x.a, se, schaltwerk);
  });
  return z;
}

function bauAnsicht(p) {
  var key = p.name + '|' + R.mk + '|' + R.s;
  var b = (D.bau || {})[key], se = serieVon(R.mk, R.s);
  if (!S.bauModus) S.bauModus = 'gruppe';
  var h = heldGruppe(p, { titel: 'Baukasten', unter: R.mk + ' ' + R.s + (se ? ' · ' + steckbrief(se) : ''),
    brot: [[p.name, { v: 'projekt', pj: p.name }], [R.mk, { v: 'marke', pj: p.name, mk: R.mk }], ['Baukasten']] });
  h += '<div class="abschnitt" style="margin-top:20px"><div class="seg">' + [['gruppe', 'Eine Gruppe'], ['mix', 'Gemischt']].map(function (x) {
    return '<button class="' + (S.bauModus === x[0] ? 'an' : '') + '" ' + attr({ a: 'baumodus', m: x[0] }) + '>' + x[1] + '</button>';
  }).join('') + '</div><p class="hinweis-klein">' + (S.bauModus === 'gruppe' ? 'Alle Teile aus ' + esc(R.s) + ': passt garantiert und sieht einheitlich aus.' : 'Teile aus verschiedenen Gruppen, die laut Prüfung zusammen funktionieren. Meist günstiger.') + '</p></div>';
  var andere = Object.keys(D.bau || {}).filter(function (k) { return k.indexOf(p.name + '|' + R.mk + '|') === 0; }).map(function (k) { return k.split('|')[2]; });
  if (andere.length > 1) h += '<div class="chips" style="margin-top:14px">' + andere.map(function (s) {
    return '<button class="chip' + (s === R.s ? ' an' : '') + '" ' + route({ v: 'bau', pj: p.name, mk: R.mk, s: s }) + '>' + esc(s) + '</button>';
  }).join('') + '</div>';
  if (!b) { $('ansicht').innerHTML = h + '<div class="abschnitt karte leer"><b>Noch kein Baukasten</b>Dafür braucht der Agent passende Einzelteile der letzten 21 Tage.</div>'; return; }
  var z = bauZeilen(key, b, se);
  var summe = z.reduce(function (s2, x) { return s2 + (x.a ? x.a.p : 0); }, 0);
  var voll = z.every(function (x) { return x.a; });
  var pruef = z.filter(function (x) { return x.a && x.ok !== 'ja'; }).length;
  var ab = abholungSumme(z.map(function (x) { return x.a; }).filter(function (a) { return a && naehe(a.km, D.umkreis) && naehe(a.km, D.umkreis).s !== 'weit'; }), D.sprit);
  var lim = p.bauLimit;
  var anteil = lim ? Math.min(1, summe / lim) : (voll ? 1 : z.filter(function (x) { return x.a; }).length / z.length);
  var u = 2 * Math.PI * 80;
  var farbe = !voll ? 'var(--akz)' : lim && summe > lim ? 'var(--warn)' : pruef ? 'var(--warn)' : 'var(--gut)';
  h += '<div class="bau-ring"><div class="r"><svg viewBox="0 0 190 190" style="width:190px;height:190px" role="img" aria-label="Summe ' + esc(eur(summe)) + '"><circle cx="95" cy="95" r="80" fill="none" stroke-width="14" style="stroke:var(--fl)"></circle>' +
    '<circle cx="95" cy="95" r="80" fill="none" stroke-width="14" stroke-linecap="round" stroke-dasharray="' + (u * anteil).toFixed(1) + ' ' + u.toFixed(1) + '" transform="rotate(-90 95 95)" style="stroke:' + farbe + '"></circle></svg>' +
    '<div><span>' + (voll ? 'Gesamt' : 'Bisher') + '</span><b>' + eur(summe) + '</b><span>' + (lim ? 'von ' + eur(lim) + ' Budget' : z.filter(function (x) { return x.a; }).length + ' von ' + z.length + ' Teilen') + '</span></div></div>' +
    '<span class="pill ' + (!voll ? '' : pruef ? 'warn' : 'gut') + '" style="margin-top:14px">' + (!voll ? 'unvollständig' : pruef ? pruef + ' prüfen' : 'passt ✓') + '</span>' +
    (ab ? '<p class="sprit" style="margin-top:10px;text-align:center">Abholung separat ≈ ' + eur(Math.round(ab.euro)) + ' für ' + ab.fahrten + ' Fahrt' + (ab.fahrten > 1 ? 'en' : '') + '</p>' : '') + '</div>';
  h += '<div class="abschnitt karte">' + z.map(function (x) {
    var a = x.a;
    var gb = gBild(R.mk, R.s, x.t);
    if (!a) return '<div class="bauzeile"><div class="th" style="' + bildCss(kaBild(gb)) + ';opacity:.5">' + (gb ? '' : TEIL_SYMBOL[x.t]) + '</div><div class="tx"><b>' + esc(TEILE[x.t]) + '</b><div class="ti">' + (S.bauModus === 'gruppe' ? 'noch nicht aus ' + esc(R.s) + ' gefunden' : 'noch kein passendes Angebot') + '</div></div></div>';
    var nh = naehe(a.km, D.umkreis);
    return '<div class="bauzeile"><button class="th' + bildKl(a.b) + '" style="' + bildCss(kaBild(a.b)) + '" ' + attr({ a: 'angebot', k: a.k }) + ' aria-label="Angebot öffnen"></button><div class="tx"><b>' + esc(TEILE[x.t]) + '</b> ' +
      '<span class="pill ' + (x.ok === 'ja' ? 'gut' : 'warn') + '" style="font-size:11px">' + (x.ok === 'ja' ? '✓ passt' : '⚠ ' + esc(x.grund)) + '</span>' +
      '<div class="ti">' + esc(a.ti) + '</div><div class="sub klein">' + esc([nh ? a.km + ' km' : '', a.pl, a.n != null ? 'Note ' + a.n : ''].filter(Boolean).join(' · ')) + '</div></div>' +
      '<div class="pr">' + eur(a.p) + (x.alt.length > 1 ? '<button ' + attr({ a: 'bau-tausch', t: x.t }) + '>tauschen</button>' : '') + '</div></div>';
  }).join('') + '</div>';
  h += '<div class="abschnitt karte"><h2>Passt alles zusammen?</h2><div class="pruefliste" style="margin-top:8px">' + bauPruefung(z, se, p).map(function (x) {
    return '<div><i>' + (x[0] === 'ja' ? '✅' : x[0] === 'nein' ? '❌' : '⚠️') + '</i><span>' + esc(x[1]) + '</span></div>';
  }).join('') + '</div><button class="ki-knopf" data-a="bau-ki" id="bau-ki">' + ic('funken') + 'KI prüft die Kombination</button><div id="bau-ki-ergebnis"></div></div>';
  $('ansicht').innerHTML = h;
}

// ---------- Ereignisse ----------
document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-a]');

  var a = el.getAttribute('data-a'), d = function (k) { return el.getAttribute('data-' + k); };
  if (el.tagName === 'A') return;
  ev.preventDefault();
  if (a === 'nav') { S.q = ''; geh({ v: d('v') }); }
  else if (a === 'laden') laden(true);
  else if (a === 'zahl') { S.gut = d('f') === 'gut'; S.bereich = d('f') === 'nah' ? 'nah' : 'alle'; geh({ v: d('ziel') }); }
  else if (a === 'projekt') { S.zust = 'alle'; S.tage = 0; geh({ v: 'projekt', pj: d('pj'), pfad: [] }); }
  else if (a === 'kat') { var kv = d('v') || (R.v === 'kat' ? 'kat' : 'projekt'); geh({ v: kv, pj: R.pj, pfad: (R.v === kv ? R.pfad || [] : []).concat([d('name')]) }); }
  else if (a === 'pfad') { var pi = Number(d('i')); if (!pi && R.v === 'kat') geh({ v: 'projekt', pj: R.pj }); else geh({ v: R.v, pj: R.pj, pfad: (R.pfad || []).slice(0, pi) }); }
  else if (a === 'geh') { var ziel = JSON.parse(d('r')); if (ziel.v === 'teile' || ziel.v === 'gruppe') S.nurSerie = false; geh(ziel); }
  else if (a === 'nurserie') { S.nurSerie = !!d('n'); zeichne(); }
  else if (a === 'bau-tausch') bauTausch(d('t'));
  else if (a === 'bau-wahl') { var bk = R.pj + '|' + R.mk + '|' + R.s; S.bauWahl[bk] = S.bauWahl[bk] || {}; S.bauWahl[bk][d('t')] = d('k'); blattZu(); zeichne(); }
  else if (a === 'bau-ki') bauKi();
  else if (a === 'sorte') einstellung('sorte', d('s'));
  else if (a === 'zurueck') zurueck();
  else if (a === 'marke') { R.marke = R.marke === d('m') ? '' : d('m'); geh(R, true); }
  else if (a === 'wunsch') { R.wunsch = d('w'); geh(R, true); }
  else if (a === 'zust') { S.zust = d('z'); zeichne(); }
  else if (a === 'bereich') { S.bereich = d('b'); zeichne(); }
  else if (a === 'gut') { S.gut = !S.gut; zeichne(); }
  else if (a === 'tage') { S.tage = Number(d('t')); zeichne(); }
  else if (a === 'serie') { var n = d('s'); S.aus[n] = !S.aus[n]; el.classList.toggle('aus', S.aus[n]); if (CHART) CHART.toggleSeries(n); }
  else if (a === 'mehr') { S.anzahl += 40; var y = window.scrollY; zeichne(); window.scrollTo(0, y); }
  else if (a === 'sortwahl') sortWahl();
  else if (a === 'sort') { S.sort = d('s'); blattZu(); zeichne(); }
  else if (a === 'tpj') { R.pj = d('pj'); zeichne(); }
  else if (a === 'angebot') { if (ev.target.closest('[data-a="merken"]') && ev.target.closest('[data-a="merken"]') !== el) return; detail(d('k')); }
  else if (a === 'merken') { ev.stopPropagation(); merkenSchalten(d('k')); }
  else if (a === 'weg') ausblendenSchalten(d('k'));
  else if (a === 'entwurf') entwurf(d('k'));
  else if (a === 'kopieren-entwurf') kopieren($('entwurf-text').value);
  else if (a === 'kopieren') kopieren(d('text'));
  else if (a === 'teilen') { var x = D.idx[d('k')]; if (navigator.share) navigator.share({ title: x.ti, text: eur(x.p) + ' · ' + x.ti, url: x.l }).catch(function (e) { if (!e || e.name !== 'AbortError') kopieren(x.l); }); else kopieren(x.l); }
  else if (a === 'blatt-zu') blattZu();
  else if (a === 'suchen') suchenStarten();
  else if (a === 'testpush') server('testPushSeite', [], function () { toast('Test-Push gesendet ✓'); });
  else if (a === 'fotos') einstellung('kiFotos', el.classList.contains('an') ? 'Nein' : 'Ja');
  else if (a === 'zu-wunsch') { var w = D.wuensche.filter(function (x) { return x.pj === d('pj') && x.w === d('w'); })[0]; geh({ v: 'projekt', pj: d('pj'), pfad: w ? pfadVon(w) : [] }); }
  else if (a === 'neues-projekt') editorAuf(null);
  else if (a === 'bearbeiten') editorAuf(d('pj'), d('w'));
  else if (a === 'pbild') bildWahl(d('pj'));
  else if (a === 'pbild-setzen') projektBildSpeichern(d('u'));
  else if (a === 'pbild-url') { var u = ($('pbild-url').value || '').trim(); if (u && !/^https:\/\//i.test(u)) { toast('Bitte einen Link mit https:// eingeben'); return; } projektBildSpeichern(u); }
  else if (a === 'pbild-weg') projektBildSpeichern('');
  else if (a === 'verbinden') verbinden();
  else if (a === 'neu-verbinden') { SCHLUESSEL = ''; speicher('mp_schluessel', ''); linkOhneSchluessel(); verbindenAnsicht(); }
  else if (a === 'install-weg') { speicher('mp_installiert', '1'); zeichne(); }
  else if (a === 'antrieb') { S.antrieb = d('x'); zeichne(); }
  else if (a === 'baumodus') { S.bauModus = d('m'); zeichne(); }
  else if (ED) editorKlick(a, d, el);
});

function editorKlick(a, d, el) {
  var i = Number(d('i'));
  if (a === 'ed-emojis') ED.emojis = !ED.emojis;
  else if (a === 'ed-emoji') { ED.symbol = d('e'); ED.emojis = false; }
  else if (a === 'ed-farbe') ED.farbe = d('f');

  else if (a === 'ed-kat-auf') ED.wuensche[i].offen = !ED.wuensche[i].offen;

  else if (a === 'ed-w-aktiv') ED.wuensche[i].aktiv = !ED.wuensche[i].aktiv;
  else if (a === 'ed-chip-weg') { var ziel = d('feld') === 'ausschluss' ? ED.ausschluss : ED.wuensche[Number(d('i'))].begriffe; ziel.splice(Number(d('j')), 1); }
  else if (a === 'ed-marke-neu') ED.marken.push({ name: '', modelle: [], logo: '' });
  else if (a === 'ed-marke-weg') ED.marken.splice(i, 1);
  else if (a === 'ed-marken-erkannt') (D.marken[ED.name] || []).forEach(function (m) { if (!ED.marken.some(function (x) { return slug(x.name) === slug(m.name); })) ED.marken.push({ name: m.name, modelle: markenParsen(D.proj[ED.name].marken).length ? m.modelle : [], logo: m.logo || '' }); });
  else if (a === 'ed-aktiv') ED.aktiv = !ED.aktiv;
  else if (a === 'ed-loeschen') ED.loeschen = true;
  else if (a === 'ed-loeschen-nein') ED.loeschen = false;
  else if (a === 'ed-loeschen-ja') { loeschen(); return; }
  else if (a === 'ed-speichern') { speichern(); return; }
  else return;
  editorZeichnen();
}

// Nach dem Verlassen eines Felds erst etwas später neu zeichnen: sonst ginge ein Tipp auf "Speichern" verloren,

document.addEventListener('input', function (ev) {

document.addEventListener('change', function (ev) {

(function () {

    try { sessionStorage.setItem('mp_basis', String(basis)); } catch (e) { /* egal */ }
  }

  speicher('mp_besuch', String(Date.now()));
})();
try { if (HIST) HIST.replace(R); else history.replaceState(R, ''); } catch (e) { /* egal */ }
laden();
